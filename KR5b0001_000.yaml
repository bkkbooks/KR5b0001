body:
  text: 御製靈寶天尊説洪恩靈濟真君妙經序朕惟道之為教闡鴻濛虗玄之祕具無極自然之妙窈窈冥冥昏昏默默視之而不見其形聽之而不聞其聲上以隂翊皇度下以利濟羣品功德之大不可名言有若九天金闕明道逹德大仙顯靈溥濟清微洞玄沖虗妙感慈惠護國庇民洪恩真君江王九天玊闕宣化扶教上仙昭靈博濟髙明弘靜沖湛妙應仁惠輔國佑民洪恩真君饒王萃靈鍾秀天挺人豪寬惠慈祥仁民愛物忠君孝親崇信三寶篤志好善精勤不二功成行滿遂感天封昭錫徽號序列仙品弼亮化機出幽入明禦災捍患驅沴致祥敷祐下土利濟羣生乃者弘闡靈貺翊衛朕躬扶持保庇載底平寧巳而示以符藥廣施寰宇期在使人蠲除疾𤵟暮育子孫大德深恩同於天地朕感神之惠夙夜弗忘萬幾之暇因閲靈寶天尊説洪恩靈濟真君妙經顯微玄奧神化莫測方便利益拔濟曠劫誠燭幽之日月而濟海之舟航也乃以鋟梓用廣流傅以報神休善信之士果能洗滌懴侮崇信三寶盡忠盡孝行仁行義弘發誓願受持諷誦則身家吉慶命運亨通子孫暮衒消災度厄增福延夀延及九祖咸獲超躋苟或訾毀輕慢凌忽三寶不忠不孝不仁不義不能敬信奉持則身罹惡業門戶衰替子孫微弱壽年夭促纍及九祖水墮淪𡨕歷觀巳往具有明徵於乎吉凶善惡皆由心造為善獲福為惡受殃此自然之理故曰積善之家必有餘慶積不善之家必有餘殃又曰惟上帝不常作善降之百祥作不善降之百殃然則觀於此者可不知所勉哉可不知所勉哉永樂十八年正月初一日靈寶天尊説洪恩靈濟奠君妙經爾時靈實天尊在大羅天上五明宫中憑几而坐鐘磬自鳴宴集諸天星衆五斗大神宣演太上無極至真妙道時有斗中都水二使者左執靑節右仗黃銊侍立帝前稽首再拜長跪而進言臣等宿生慶幸得預天人下觀欲界衆生不忠不孝不義不仁多作惡業全無慚愧曆數巳終今生末劫丑口失圖綱維折裂兵火肆興玉石焚喪或遭洪水或遇凶年刑賦苛虐災毒流行罹諸苦惱不知解悟生意幾息人道將窮作何因緣可以救度願垂憐憫開方便門天尊曰善哉善哉末劫衆生一如赤子發汝如是心成汝如是願依吾教法廣為衆生説諸因緣令開悟性勿生疑慮曰忠與孝曰仁與義四者修持常居吉慶臣等既承斯語敢不奉行乃於甲辰之歲丙午之年下降人間分身教化成功東海顯迹南邦甲子一周復還職任香火一方歷年彌久載逢滅受復誓如初躐進仙階真君錫號蒙天尊嗟憫之仁體太上好生之德使一切善男善女知身性命皆憑道生忠孝仁義了悟此因能於三元八節三會五臘庚申甲子本命之日梵香修齊如法供養𡨕心向北稽首禮念九天金闕明道達德大仙顯靈溥濟清微洞玄沖虛妙感慈惠護國庇民洪恩奠君江王九天玊閣宣化扶教上仙昭靈博濟髙明弘靜沖湛妙應仁惠輔國佑民洪恩奠君饒王恭對聖慈依經懴悔不違真君之誓願各以忠孝仁義而立身內可以增福延年外可以消災度厄上可以使祖禰之魂神超度下可以使家宅之眷屬乂寧普願衆生同霑利樂於是天尊重為真君演説而作偈曰靈濟真君修真得道遊宴仙都天尊錫號北斗降神洋洋于左下臨三界上朝五老福國寧家其功浩浩無願不從默符所禱忠孝仁義永為身寶用作因緑不違誓好一切善惡皆由心造為善者福為惡者禍急急如天尊律今勑靈寶天尊説洪恩靈濟真君妙經終
